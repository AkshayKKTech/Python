name: Learning github actions

on:
  push:
    branches: 
      - master


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stage
        uses: actions/checkout@v7
    # - name: Setting up python version
    #   uses: actions/setup-python@v5
    #   with:
    #     python-version: '3.11'
      - name: Build python
        run: python app.py
      - name: Docker image build
        run: docker build -t akshaykkdocker623/pythonapp:v1 .
        

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_LOGIN}}
          password: ${{secrets.DOCKERLOGIN_PASSWORD}}

      
