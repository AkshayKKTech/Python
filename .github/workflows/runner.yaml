name: Testing runner works

on: 
  push:
    branches:
      - master

jobs:
  build:
    runs-on: Github_runner1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: build
        run: python app.py

  Docker:
    runs-on: Github_runner1
    steps:
      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_LOGIN}}
          password: ${{secrets.DOCKERLOGIN_PASSWORD}}
      - name: Docker build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: akshaykkdocker623/pythonapp:v2
